name: Build RemotePC

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RemotePC-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r server/requirements.txt pyinstaller
      - name: Gerar EXE
        working-directory: server
        run: pyinstaller --noconfirm --onefile --name RemotePC-Server --add-data "web;web" --collect-all vgamepad --collect-all pyvirtualcam --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 server.py
      - uses: actions/upload-artifact@v4
        with:
          name: RemotePC-Server-EXE
          path: server/dist/RemotePC-Server.exe
